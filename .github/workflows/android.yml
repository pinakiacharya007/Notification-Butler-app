name: Free Android Cloud Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # If you uploaded the raw ZIP file to the repo, this step ensures it unzips correctly
    - name: Unzip project if zipped
      run: |
        if [ -f *.zip ]; then
          unzip *.zip
          # Move files up to root if nested inside a single folder inside the zip
          if [ -d Notification* ]; then
            mv Notification*/* . 2>/dev/null || true
          fi
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission to Gradle
      run: chmod +x gradlew

    - name: Compile and Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NotificationButler-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk" # This wildcard dynamically finds the APK wherever it is
