name: Free Android Cloud Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip project if zipped
      run: |
        if [ -f *.zip ]; then
          unzip *.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Find and Run Gradle Build
      run: |
        # Find where gradlew is located in the directory tree
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew file could not be found anywhere in the repository!"
          exit 1
        fi
        
        echo "Found gradlew at: $GRADLEW_PATH"
        
        # Change directory to where gradlew lives
        cd $(dirname "$GRADLEW_PATH")
        
        # Grant permissions and compile the app
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NotificationButler-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
