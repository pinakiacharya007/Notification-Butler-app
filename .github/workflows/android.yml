name: Free Android Cloud Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip project if zipped
      run: |
        if [ -f *.zip ]; then
          unzip *.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # This installs the exact Gradle version your project requires
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9

    - name: Find Project and Build APK
      run: |
        # Find where settings.gradle.kts lives in the extracted files
        SETTINGS_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
        
        if [ -z "$SETTINGS_PATH" ]; then
          echo "Error: Could not find settings.gradle.kts anywhere!"
          exit 1
        fi
        
        # Change directory to where the project configuration is located
        cd $(dirname "$SETTINGS_PATH")
        
        # Compile using the globally installed Gradle version instead of gradlew
        gradle assembleDebug

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NotificationButler-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
